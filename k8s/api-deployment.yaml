apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: vk-interest-predictor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: your-registry/vk-interest-predictor:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: VK_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: vk-secrets
              key: VK_API_TOKEN
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: vk-config
              key: REDIS_HOST
        - name: MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: vk-config
              key: MODEL_PATH
        - name: DEVICE
          valueFrom:
            configMapKeyRef:
              name: vk-config
              key: DEVICE
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: models
          mountPath: /app/models
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: vk-interest-predictor
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: vk-interest-predictor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: vk-interest-predictor
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
