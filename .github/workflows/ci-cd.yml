name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  reproducible-poc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install pytest numpy
      - name: Compile changed ML path
        run: python -m compileall ml scripts tests
      - name: Contract and checkpoint tests
        run: python -m pytest -q tests/ --junitxml=artifacts/tests.xml
      - name: E2E smoke run
        run: python scripts/run_e2e_pipeline.py --num-users 32 --epochs 1 --batch-size 8 --output-dir artifacts/ci-e2e
      - name: Benchmark smoke run
        run: python scripts/benchmark.py --model artifacts/ci-e2e/model.pt --device cpu --warmup 1 --num-runs 3 --batch-size 1 --output artifacts/ci-benchmark.json
      - name: Validate benchmark artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/ci-benchmark.json')
          data = json.loads(p.read_text())
          assert data['measured_runs'] == 3
          assert data['latency_ms']['p50'] >= 0
          assert data['commit_sha']
          assert data['checkpoint'] == 'artifacts/ci-e2e/model.pt'
          print(data)
          PY
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-evidence-python-${{ matrix.python-version }}
          path: |
            artifacts/tests.xml
            artifacts/ci-e2e/results.json
            artifacts/ci-benchmark.json
          if-no-files-found: warn
